name: Container CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: vibecheck-container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/anjingyeong/vibecheck

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run benchmark

  arm64-image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ARM64 image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          load: true
          tags: vibecheck:ci
          cache-from: type=gha,scope=vibecheck-arm64
          cache-to: type=gha,mode=max,scope=vibecheck-arm64

      - name: Smoke test ARM64 container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name vibecheck-ci --platform linux/arm64 \
            -p 127.0.0.1:8787:8787 \
            vibecheck:ci
          trap 'docker rm -f vibecheck-ci >/dev/null 2>&1 || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/healthz >/dev/null; then
              docker inspect --format '{{.State.Status}}' vibecheck-ci
              exit 0
            fi
            sleep 1
          done
          docker logs vibecheck-ci
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=vibecheck-arm64
          cache-to: type=gha,mode=max,scope=vibecheck-arm64
          provenance: true
          sbom: true

  deploy-oci:
    needs: arm64-image
    runs-on: [self-hosted, Linux, ARM64, oci]
    permissions:
      contents: read
      packages: read
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify OCI host privilege
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          sudo -n true

      - name: Install and start Docker when needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            sudo -n apt-get update
            sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io
          fi
          sudo -n systemctl enable --now docker
          sudo -n docker version >/dev/null

      - name: Log in to GHCR on OCI
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | sudo -n docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null

      - name: Deploy verified ARM64 image
        shell: bash
        run: |
          set -euo pipefail
          runtime_env="${RUNNER_TEMP}/vibecheck.env"
          umask 077
          : > "$runtime_env"
          printf '%s\n' \
            'VIBECHECK_RUNS=3' \
            'VIBECHECK_MAX_PAGES=4' \
            'VIBECHECK_CONCURRENCY=1' \
            'VIBECHECK_MAX_JOBS=50' \
            'VIBECHECK_JOB_TTL_MS=86400000' \
            'VIBECHECK_RATE_LIMIT=5' \
            'VIBECHECK_RATE_WINDOW_MS=3600000' >> "$runtime_env"
          if [ -n "${GROQ_API_KEY:-}" ]; then
            printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY" >> "$runtime_env"
            echo 'ai_provider=groq'
          elif [ -n "${GEMINI_API_KEY:-}" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> "$runtime_env"
            echo 'ai_provider=gemini'
          else
            echo 'ai_provider=none'
          fi
          trap 'rm -f "$runtime_env"' EXIT

          sudo -n docker pull "${IMAGE}:${GITHUB_SHA}"
          sudo -n docker volume create vibecheck-data >/dev/null
          sudo -n docker rm -f vibecheck >/dev/null 2>&1 || true
          sudo -n docker run -d \
            --name vibecheck \
            --restart unless-stopped \
            --ipc=host \
            --security-opt "seccomp=${GITHUB_WORKSPACE}/deploy/seccomp_profile.json" \
            --env-file "$runtime_env" \
            -p 127.0.0.1:8787:8787 \
            -v vibecheck-data:/app/artifacts \
            "${IMAGE}:${GITHUB_SHA}" >/dev/null

      - name: Verify deployed health
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/healthz >/dev/null; then
              echo 'health=200'
              sudo -n docker inspect --format 'status={{.State.Status}} restart={{.HostConfig.RestartPolicy.Name}} user={{.Config.User}}' vibecheck
              exit 0
            fi
            sleep 1
          done
          sudo -n docker logs --tail 100 vibecheck
          exit 1
