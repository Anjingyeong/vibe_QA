name: Container CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: vibecheck-container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vibecheck

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run benchmark

  arm64-image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ARM64 image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          load: true
          tags: vibecheck:ci
          cache-from: type=gha,scope=vibecheck-arm64
          cache-to: type=gha,mode=max,scope=vibecheck-arm64

      - name: Smoke test ARM64 container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name vibecheck-ci --platform linux/arm64 \
            -p 127.0.0.1:8787:8787 \
            vibecheck:ci
          trap 'docker rm -f vibecheck-ci >/dev/null 2>&1 || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/healthz >/dev/null; then
              docker inspect --format '{{.State.Status}}' vibecheck-ci
              exit 0
            fi
            sleep 1
          done
          docker logs vibecheck-ci
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=vibecheck-arm64
          cache-to: type=gha,mode=max,scope=vibecheck-arm64
          provenance: true
          sbom: true
